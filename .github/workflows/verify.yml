name: verify-lessons
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --prefix tools
      - run: python tools/validate.py
      - run: python tools/validate_interview.py
      - run: python tools/validate_mock.py
      - run: python tools/validate_python.py
      - run: node --check apps/prototype/app.js
      - run: node --check apps/prototype/interview.js
      - run: node --check apps/prototype/readiness.js
      - run: node --check apps/prototype/mock.js
      - run: node --check apps/prototype/python-practice.js
      - run: node --check apps/prototype/python-worker.mjs
      - run: node --check apps/prototype/auth.js
      - run: node --check apps/prototype/auth-data.mjs
      - run: node --check apps/prototype/tutor.js
      - run: node tools/verify_interview_core.mjs
      - run: node tools/verify_auth_state.mjs
      - run: python tools/verify.py --strict
