name: Deploy Devoal to GitHub Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package original interface
        run: python tools/build_prototype.py
        env:
          DEVOAL_FIREBASE_API_KEY: ${{ vars.DEVOAL_FIREBASE_API_KEY }}
          DEVOAL_FIREBASE_AUTH_DOMAIN: ${{ vars.DEVOAL_FIREBASE_AUTH_DOMAIN }}
          DEVOAL_FIREBASE_PROJECT_ID: ${{ vars.DEVOAL_FIREBASE_PROJECT_ID }}
          DEVOAL_FIREBASE_APP_ID: ${{ vars.DEVOAL_FIREBASE_APP_ID }}
          DEVOAL_TUTOR_API_URL: ${{ vars.DEVOAL_TUTOR_API_URL }}
      - name: Check problem discovery, saved drafts and account flows in Chrome
        run: |
          python -m pip install playwright==1.55.0
          python tools/verify_library_browser.py
          python tools/verify_auth_browser.py
          python tools/verify_workspace_browser.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/prototype/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
